<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Replay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <div id="avatar">C</div>
    <div id="name">Claude</div>
    <div id="info">Drop a Claude Code session .jsonl</div>
  </header>
  <main id="drop">
    <label id="picker">
      <p>Drop a <code>.jsonl</code> file here or click to pick one.</p>
      <p class="hint">Sessions live in <code>~/.claude/projects/&lt;project&gt;/&lt;session&gt;.jsonl</code></p>
      <input id="file" type="file" accept=".jsonl,.json,.txt" hidden>
    </label>
    <div id="log"></div>
  </main>
  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
