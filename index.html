<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Replay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="threads">
    <div id="threads-head">
      <h1>Sessions</h1>
      <label class="btn">Files<input id="file" type="file" accept=".jsonl,.zst" multiple hidden></label>
      <label class="btn">Folder<input id="folder" type="file" webkitdirectory hidden></label>
    </div>
    <ul id="list"></ul>
  </aside>
  <section id="chat">
    <header id="bar">
      <button id="back" aria-label="Back">‹</button>
      <div id="avatar"></div>
      <div id="name">Claude</div>
      <div id="info"></div>
    </header>
    <div id="empty">
      <p>Drop session <code>.jsonl</code> files or a folder of sessions anywhere.</p>
      <p class="hint">Claude: <code>~/.claude/projects/&lt;project&gt;/</code> · Codex: <code>~/.codex/sessions/</code></p>
    </div>
    <div id="log"></div>
  </section>
  <script src="vendor/fzstd.js"></script>
  <script src="md.js"></script>
  <script src="codex.js"></script>
  <script src="app.js"></script>
</body>
</html>
