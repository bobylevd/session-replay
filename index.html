<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Replay</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header id="bar">
    <div id="meta"><strong>Session Replay</strong> <span id="info">Drop a Claude Code session .jsonl</span></div>
  </header>
  <main id="drop">
    <label id="picker">
      <p>Drop a <code>.jsonl</code> file here or click to pick one.</p>
      <p class="hint">Sessions live in <code>~/.claude/projects/&lt;project&gt;/&lt;session&gt;.jsonl</code></p>
      <input id="file" type="file" accept=".jsonl,.json,.txt" hidden>
    </label>
    <div id="log"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
